<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Open Source RepoHub</title>
<meta name="description" content="A curated collection of open-source projects, tools and resources for builders, developers and AI enthusiasts.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">🚀</span>
    <span class="brand-text">Repo<span>Hub</span></span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search 610 projects…" autocomplete="off" spellcheck="false" aria-label="Search projects">
    <button class="clear-btn" id="clearSearch" aria-label="Clear search" hidden>&times;</button>
  </div>

  <div class="topbar-meta">
    <span class="count-pill" id="countPill">610</span>
  </div>

  <button class="icon-btn" id="themeBtn" aria-label="Toggle colour theme">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>

<div class="shell">

  <!-- Desktop sidebar / mobile drawer -->
  <nav class="sidebar" id="sidebar" aria-label="Sections">
    <div class="sidebar-head only-mobile">
      <span>Sections</span>
      <button class="icon-btn" id="closeMenu" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
    </div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-foot">
      <a class="gh-link" href="https://github.com/johnpuri/Open_Source_RepoHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>Source on GitHub</span>
      </a>
    </div>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <main class="content" id="content">
    <div class="hero" id="hero">
      <h1>Open Source RepoHub</h1>
      <p>A curated collection of open-source projects, tools and resources for builders, developers and AI enthusiasts.</p>
      <div class="hero-stats" id="heroStats"></div>
    </div>

    <!-- Filter bar: inline chips on desktop, bottom-sheet trigger on mobile -->
    <div class="filterbar" id="filterbar">
      <button class="filter-toggle only-mobile" id="filterToggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
        <span>Filters</span>
        <span class="filter-badge" id="filterBadge" hidden>0</span>
      </button>

      <div class="filter-groups" id="filterGroups">
        <div class="filter-group">
          <span class="filter-label">Type</span>
          <div class="chips" id="typeChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Stars</span>
          <div class="chips" id="starChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Language</span>
          <div class="chips" id="langChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Licence</span>
          <div class="chips" id="licenceChips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort</span>
          <select id="sortSelect" class="sort-select">
            <option value="default">Source order</option>
            <option value="stars-desc">Most stars</option>
            <option value="stars-asc">Fewest stars</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
        <button class="reset-btn" id="resetFilters" hidden>Clear all</button>
      </div>
    </div>

    <div class="active-filters" id="activeFilters"></div>
    <div id="list" class="list" role="list"></div>
    <p class="empty" id="empty" hidden>No projects match “<span id="emptyTerm"></span>”.
      <span class="empty-filters" hidden><br><button class="reset-btn" id="emptyReset">Clear all filters</button></span>
    </p>
    <footer class="site-foot">
      <span id="footMeta"></span>
    </footer>
  </main>

</div>

<button class="to-top" id="toTop" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="app.js"></script>
</body>
</html>
